{% extends "base.html" %}
{% block content %}

<h1>Available Trips</h1>

{% for t in trips %}
<div class="glass-card" style="margin-top:25px;">
    <h2>Trip #{{ t.trip_id }}</h2>
    <p><strong>Origin:</strong> {{ t.origin }}</p>
    <p><strong>Destination:</strong> {{ t.destination }}</p>
    <p><strong>Departure:</strong> {{ t.departure_time }}</p>
    <p><strong>Price/Seat:</strong> ${{ t.seat_price }}</p>

    <a href="/reserve/{{ t.trip_id }}">
        <button class="action-btn">Reserve This Trip</button>
    </a>
</div>
{% endfor %}

{% endblock %}
